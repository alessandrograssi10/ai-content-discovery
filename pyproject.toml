[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
# Pinned explicitly so local runs and CI check the same rules regardless of
# the ruff version's defaults: syntax/runtime errors, pyflakes, import order.
select = ["E4", "E7", "E9", "F", "I"]
